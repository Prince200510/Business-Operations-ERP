databases:
  - name: nexora-postgres
    databaseName: business_operations
    user: erp_user
    plan: free

services:
  - type: keyvalue
    name: nexora-redis
    plan: free
    ipAllowList: []
  - type: web
    name: nexora-backend
    env: python
    buildCommand: "cd backend && pip install -r requirements.txt"
    startCommand: "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    plan: free
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: nexora-postgres
          property: connectionString
          
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: nexora-redis
          property: connectionString
