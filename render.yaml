databases:
  # 1. Managed PostgreSQL Database
  - name: nexora-postgres
    databaseName: business_operations
    user: erp_user
    plan: free

services:
  # 2. Managed Redis Cache
  - type: keyvalue
    name: nexora-redis
    plan: free

  # 3. Python FastAPI Backend
  - type: web
    name: nexora-backend
    env: python
    buildCommand: "cd backend && pip install -r requirements.txt"
    startCommand: "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    plan: free
    envVars:
      # Automatically inject the internal PostgreSQL connection string
      - key: DATABASE_URL
        fromDatabase:
          name: nexora-postgres
          property: connectionString
          
      # Automatically inject the internal Redis connection string
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: nexora-redis
          property: connectionString
